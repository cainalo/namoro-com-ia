plugins {
    id "com.android.application"
}

android {
    namespace "com.morados.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.morados.app"
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName "1.2.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            // Instala como uma edição separada para evitar o conflito de assinatura
            // com as versões antigas já instaladas no aparelho.
            applicationIdSuffix ".v2"
            versionNameSuffix "-debug"
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.16.0"
}
