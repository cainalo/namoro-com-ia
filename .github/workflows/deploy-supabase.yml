name: Deploy Supabase backend

on:
  push:
    branches:
      - prod
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"

permissions:
  contents: read

concurrency:
  group: deploy-supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply database migrations and deploy Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: jffryzeelzxjqbeagecb

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment credential
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Configure o secret SUPABASE_ACCESS_TOKEN em Settings > Secrets and variables > Actions no GitHub."
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_REF" != "jffryzeelzxjqbeagecb" ]; then
            echo "::error::O project ref de produção não corresponde ao configurado no aplicativo."
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ^3

      - name: Apply pending database migrations
        run: supabase db push --remote="$SUPABASE_PROJECT_REF" --yes

      - name: Deploy account deletion Edge Function
        run: supabase functions deploy delete-couple --remote="$SUPABASE_PROJECT_REF" --use-api --yes

      - name: Deploy authenticated call ICE configuration function
        run: supabase functions deploy get-call-ice-servers --remote="$SUPABASE_PROJECT_REF" --use-api --yes

      - name: Confirm deployed functions
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
