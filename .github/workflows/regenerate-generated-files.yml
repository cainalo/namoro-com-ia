name: Regenerate generated files

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-generated-files-main
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_ID: jffryzeelzxjqbeagecb

    steps:
      - name: Ensure this workflow runs from main
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from the main branch only."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Check Supabase access token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error title=Missing repository secret::Add SUPABASE_ACCESS_TOKEN in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Supabase database types
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          supabase gen types typescript \
            --remote="$SUPABASE_PROJECT_ID" \
            --schema public \
            > src/integrations/supabase/types.ts

      - name: Generate TanStack route tree and validate production build
        run: bun run build

      - name: Verify generated outputs
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const routeTree = readFileSync("src/routeTree.gen.ts", "utf8");
          const databaseTypes = readFileSync("src/integrations/supabase/types.ts", "utf8");

          if (!routeTree.includes("'/invite/$token'")) {
            throw new Error("TanStack route tree does not include /invite/$token.");
          }

          for (const expected of [
            "couple_invitations",
            "create_couple_invitation",
            "revoke_couple_invitation",
            "accept_couple_invitation",
          ]) {
            if (!databaseTypes.includes(expected)) {
              throw new Error(`Generated Supabase types are missing: ${expected}`);
            }
          }
          NODE
          git diff --check

      - name: Commit and push generated files
        shell: bash
        run: |
          if git diff --quiet -- src/routeTree.gen.ts src/integrations/supabase/types.ts; then
            echo "Generated files are already up to date."
            exit 0
          fi

          git add src/routeTree.gen.ts src/integrations/supabase/types.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate Supabase types and route tree"
          git push origin HEAD:main
