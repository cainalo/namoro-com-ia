name: Prune repository branches
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prune-repository-branches.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  prune:
    name: Keep only main and prod
    runs-on: ubuntu-latest
    steps:
      - name: Delete all other branches
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const keep = new Set(["main", "prod"]);

            const repository = await github.rest.repos.get({ owner, repo });
            if (repository.data.default_branch !== "main") {
              throw new Error(
                `Safety stop: expected default branch main, found ${repository.data.default_branch}`
              );
            }

            const before = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 }
            );
            const beforeByName = new Map(before.map((branch) => [branch.name, branch]));
            for (const name of keep) {
              if (!beforeByName.has(name)) {
                throw new Error(`Safety stop: required branch ${name} does not exist`);
              }
            }

            const protectedHeads = Object.fromEntries(
              [...keep].map((name) => [name, beforeByName.get(name).commit.sha])
            );
            core.info(`Found ${before.length} branches. Preserving main and prod.`);

            const remove = before.filter((branch) => !keep.has(branch.name));
            for (const branch of remove) {
              // Deleting a branch that owns an open PR closes that PR, matching
              // GitHub's documented branch-deletion behavior.
              const openPullRequests = await github.paginate(
                github.rest.pulls.list,
                {
                  owner,
                  repo,
                  state: "open",
                  head: `${owner}:${branch.name}`,
                  per_page: 100
                }
              );
              for (const pullRequest of openPullRequests) {
                await github.rest.pulls.update({
                  owner,
                  repo,
                  pull_number: pullRequest.number,
                  state: "closed"
                });
                core.warning(
                  `Closed PR #${pullRequest.number} because its head branch ${branch.name} is being removed.`
                );
              }

              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `heads/${branch.name}`
              });
              core.info(`Deleted ${branch.name}`);
            }

            const after = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 }
            );
            const remaining = after.map((branch) => branch.name).sort();
            const expected = [...keep].sort();
            if (JSON.stringify(remaining) !== JSON.stringify(expected)) {
              throw new Error(
                `Verification failed. Expected ${expected.join(", ")}, found ${remaining.join(", ")}`
              );
            }

            for (const name of keep) {
              const branch = after.find((item) => item.name === name);
              if (branch.commit.sha !== protectedHeads[name]) {
                throw new Error(`Safety check failed: preserved branch ${name} moved during cleanup`);
              }
            }

            core.notice("Branch cleanup complete. Only main and prod remain; both preserved heads are unchanged.");
