name: Build Morados Capacitor Android APK

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "android/**"
      - "index.html"
      - "capacitor.config.ts"
      - "vite.native.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morados-capacitor-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build installable Capacitor Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      # Reuse one debug signing key across builds so later APKs can update this installation.
      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: morados-capacitor-debug-keystore-v1

      - name: Ensure stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Morados Android Debug,O=Morados,C=BR"
          fi

      - name: Install application dependencies
        run: bun install --no-save

      - name: Build the web interface into local Android assets
        run: bun run build:android-web

      - name: Generate the Capacitor Android platform when needed
        run: |
          if [ ! -f android/capacitor.settings.gradle ]; then
            rm -rf android
            bunx cap add android
          fi

      - name: Sync bundled web assets and native plugins
        run: bunx cap sync android

      - name: Set native application version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("android/app/build.gradle")
          content = path.read_text()
          content, code_count = re.subn(r"(?m)^(\s*versionCode)\s*=?\s*(\d+)", lambda match: f"{match.group(1)} {int(match.group(2)) + 1}", content, count=1)
          content, name_count = re.subn(r'(?m)^(\s*versionName)\s*=?\s*"[^"]+"', r'\1 "1.3.0"', content)
          content = re.sub(r"(?m)^(\s*targetSdk(?:Version)?)\s*=?\s*\d+", r"\1 36", content)
          if code_count == 0 or name_count == 0:
              raise SystemExit("Não foi possível atualizar versionCode/versionName no Gradle.")
          path.write_text(content)
          PY

      # Keep the generated Capacitor Android project in the repository for native development.
      - name: Save generated Capacitor Android project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          if ! git diff --cached --quiet; then
            git commit -m "Generate Capacitor Android platform"
            git push origin HEAD:main
          fi

      - name: Build Android APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK release files
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Morados-Android.apk
          sha256sum release/Morados-Android.apk | tee release/Morados-Android.apk.sha256

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Morados-Capacitor-Android-APK
          path: |
            release/Morados-Android.apk
            release/Morados-Android.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: morados-capacitor-${{ github.run_number }}
          name: Morados Android nativo 1.3.0 — build ${{ github.run_number }}
          body: |
            APK Android do Morados construído com Capacitor.

            - Pacote Android: com.morados.app.capacitor
            - Interface e assets web empacotados dentro do APK.
            - Integração nativa: barra de status, teclado, botão Voltar e retorno tátil.
            - Autenticação e sincronização usam os serviços online do Morados.
          files: |
            release/Morados-Android.apk
            release/Morados-Android.apk.sha256
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
